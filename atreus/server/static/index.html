<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Atreus Visual Engine - Mobile</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08080f;
    --panel: #14141f;
    --accent: #5ec2ff;
    --text: #e6e6f0;
    --muted: #8a8aa0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 0.75rem 1rem;
    background: var(--panel);
    border-bottom: 1px solid #26263a;
  }
  header h1 { font-size: 1rem; margin: 0; }
  header .status { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  #canvas-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  canvas { width: 100%; height: 100%; display: block; }
  .metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: var(--panel);
  }
  .metric { background: #1c1c2b; border-radius: 8px; padding: 0.5rem 0.75rem; }
  .metric .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .metric .value { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 0.75rem 1rem 1.25rem;
  }
  button {
    flex: 1 1 auto;
    min-width: 6rem;
    padding: 0.6rem 0.75rem;
    border: 1px solid #33334a;
    border-radius: 8px;
    background: #1c1c2b;
    color: var(--text);
    font-size: 0.85rem;
  }
  button:active { background: #26263f; }
  .sliders { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .slider-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
  .slider-row label { width: 5.5rem; color: var(--muted); }
  .slider-row input { flex: 1; }
  .character-panel {
    margin: 0 1rem 1.25rem;
    padding: 0.75rem;
    background: var(--panel);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .character-panel h2 { font-size: 0.85rem; margin: 0 0 0.25rem; }
  .character-row { display: flex; gap: 0.5rem; }
  .character-row select, .character-row input, .character-row button {
    flex: 1;
    padding: 0.5rem;
    border: 1px solid #33334a;
    border-radius: 8px;
    background: #1c1c2b;
    color: var(--text);
    font-size: 0.85rem;
  }
  .character-row button { flex: 0 0 auto; }
  #char-state-badge {
    align-self: flex-start;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  #char-reply {
    min-height: 2.5rem;
    font-size: 0.85rem;
    color: var(--text);
    background: #1c1c2b;
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Atreus Visual Engine</h1>
    <div class="status" id="conn-status">Connecting…</div>
  </header>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="metrics">
    <div class="metric"><div class="label">Particles shown</div><div class="value" id="m-particles">-</div></div>
    <div class="metric"><div class="label">Total particles</div><div class="value" id="m-total">-</div></div>
    <div class="metric"><div class="label">Iteration</div><div class="value" id="m-iteration">-</div></div>
    <div class="metric"><div class="label">Sim FPS</div><div class="value" id="m-fps">-</div></div>
    <div class="metric"><div class="label">Messages/sec</div><div class="value" id="m-msgrate">-</div></div>
    <div class="metric"><div class="label">Last update age</div><div class="value" id="m-age">-</div></div>
  </div>

  <div class="controls">
    <button id="btn-pause">Pause</button>
    <button id="btn-resume">Resume</button>
    <button id="btn-reset">Reset</button>
  </div>
  <div class="sliders">
    <div class="slider-row">
      <label for="attraction">Attraction</label>
      <input type="range" id="attraction" min="0" max="0.2" step="0.005" value="0.02" />
    </div>
    <div class="slider-row">
      <label for="jitter">Jitter</label>
      <input type="range" id="jitter" min="0" max="30" step="0.5" value="6" />
    </div>
  </div>

  <div class="character-panel">
    <h2>Characters</h2>
    <div class="character-row">
      <select id="char-select"><option value="">No characters yet</option></select>
      <button id="btn-char-new">New</button>
    </div>
    <div id="char-state-badge">state: -</div>
    <div class="character-row">
      <input type="text" id="char-message" placeholder="Say something…" />
      <button id="btn-char-send">Send</button>
    </div>
    <div id="char-reply"></div>
  </div>


<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("conn-status");

  const worldWidth = 1280;
  const worldHeight = 720;

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  let latest = null;
  let messageTimestamps = [];
  let lastMessageAt = null;

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (latest) {
      const sx = canvas.width / worldWidth;
      const sy = canvas.height / worldHeight;
      const positions = latest.positions;
      const colors = latest.colors;
      for (let i = 0; i < positions.length; i++) {
        const [x, y] = positions[i];
        const [r, g, b] = colors[i];
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x * sx, y * sy, 2, 2);
      }
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function updateMetrics() {
    if (!latest) return;
    document.getElementById("m-particles").textContent = latest.sample_count;
    document.getElementById("m-total").textContent = latest.particle_count;
    document.getElementById("m-iteration").textContent = latest.iteration;
    document.getElementById("m-fps").textContent = latest.fps.toFixed(1);

    const now = Date.now();
    messageTimestamps = messageTimestamps.filter((t) => now - t < 5000);
    const rate = messageTimestamps.length / 5;
    document.getElementById("m-msgrate").textContent = rate.toFixed(2);
  }

  setInterval(() => {
    if (lastMessageAt !== null) {
      const ageMs = Date.now() - lastMessageAt;
      document.getElementById("m-age").textContent = `${ageMs} ms`;
    }
  }, 250);

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/particles`);

    ws.onopen = () => { statusEl.textContent = "Connected"; };
    ws.onclose = () => {
      statusEl.textContent = "Disconnected - retrying…";
      setTimeout(connect, 1000);
    };
    ws.onerror = () => { ws.close(); };
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "snapshot") {
        latest = data;
        lastMessageAt = Date.now();
        messageTimestamps.push(lastMessageAt);
        updateMetrics();
        const selectedId = document.getElementById("char-select").value;
        if (selectedId && data.character_states && data.character_states[selectedId]) {
          document.getElementById("char-state-badge").textContent = `state: ${data.character_states[selectedId]}`;
        }
      }
    };

    window.__sendCommand = (action, payload) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action, payload: payload || null }));
      }
    };
  }
  connect();

  document.getElementById("btn-pause").addEventListener("click", () => window.__sendCommand("pause"));
  document.getElementById("btn-resume").addEventListener("click", () => window.__sendCommand("resume"));
  document.getElementById("btn-reset").addEventListener("click", () => window.__sendCommand("reset"));

  document.getElementById("attraction").addEventListener("change", (e) => {
    window.__sendCommand("set_param", { name: "attraction", value: parseFloat(e.target.value) });
  });
  document.getElementById("jitter").addEventListener("change", (e) => {
    window.__sendCommand("set_param", { name: "jitter", value: parseFloat(e.target.value) });
  });

  // --- Character panel -------------------------------------------------
  const charSelect = document.getElementById("char-select");
  const charStateBadge = document.getElementById("char-state-badge");
  const charReply = document.getElementById("char-reply");
  const charMessageInput = document.getElementById("char-message");

  function populateCharacterSelect(characters) {
    const previous = charSelect.value;
    charSelect.innerHTML = "";
    if (characters.length === 0) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "No characters yet";
      charSelect.appendChild(opt);
      return;
    }
    for (const character of characters) {
      const opt = document.createElement("option");
      opt.value = character.id;
      opt.textContent = character.name;
      charSelect.appendChild(opt);
    }
    if (characters.some((c) => c.id === previous)) {
      charSelect.value = previous;
    }
  }

  async function refreshCharacters() {
    try {
      const res = await fetch("/api/characters");
      const characters = await res.json();
      populateCharacterSelect(characters);
    } catch (err) {
      // Non-fatal: character panel is additive to the particle stream.
    }
  }
  refreshCharacters();

  document.getElementById("btn-char-new").addEventListener("click", async () => {
    const name = prompt("Character name?");
    if (!name) return;
    const id = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 64) || `char-${Date.now()}`;
    try {
      await fetch("/api/characters", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, name }),
      });
      await refreshCharacters();
      charSelect.value = id;
    } catch (err) {
      charReply.textContent = "Could not create character.";
    }
  });

  async function sendCharacterMessage() {
    const characterId = charSelect.value;
    const message = charMessageInput.value.trim();
    if (!characterId || !message) return;
    try {
      const res = await fetch(`/api/characters/${encodeURIComponent(characterId)}/message`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      if (!res.ok) {
        charReply.textContent = "Character not found.";
        return;
      }
      const data = await res.json();
      charReply.textContent = data.text;
      charStateBadge.textContent = `state: ${data.state}`;
      charMessageInput.value = "";
    } catch (err) {
      charReply.textContent = "Could not reach character.";
    }
  }
  document.getElementById("btn-char-send").addEventListener("click", sendCharacterMessage);
  charMessageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendCharacterMessage();
  });
})();
</script>
</body>
</html>
